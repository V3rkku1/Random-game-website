<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play · Random Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="player">
  <nav>
    <a class="logo" href="./">random games</a>
    <strong id="title"></strong>
    <div>
      <button class="btn ghost" id="full">Fullscreen</button>
      <button class="btn" id="next">Next game</button>
    </div>
  </nav>
  <div class="frame-wrap"><iframe id="frame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></div>
  <script src="games.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("g");
    const g = GAMES.find(x => x.id === id);
    if (!g) location.href = "./";
    else {
      document.title = g.title + " · Random Games";
      document.getElementById("title").textContent = g.title;
      frame.src = g.src || `games/${g.id}/index.html`;
      frame.onload = () => frame.focus();
    }
    full.onclick = () => frame.requestFullscreen();
    next.onclick = () => {
      const others = GAMES.filter(x => x.id !== id);
      const r = others[Math.floor(Math.random() * others.length)] || g;
      location.href = r.url || `play.html?g=${r.id}`;
    };
  </script>
</body>
</html>
