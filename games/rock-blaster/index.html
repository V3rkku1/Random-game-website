<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Blaster</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- skipped: UFOs, hyperspace, sound -->
<canvas id="c"></canvas>
<script>
const ctx = c.getContext("2d");
let W, H, ship, rocks = [], shots = [], parts = [], score = 0, lives, wave, state = "ready", cool = 0, inv = 0, best = 0;
try { best = +localStorage.getItem("rock-best") || 0; } catch {}
const fit = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
fit(); addEventListener("resize", fit);
const wrap = o => { o.x = (o.x + W) % W; o.y = (o.y + H) % H; };
function rock(x, y, r) {
  const pts = Array.from({ length: 11 }, () => .7 + Math.random() * .35), a = Math.random() * 7, s = 40 + Math.random() * 60 * (50 / r);
  return { x, y, r, pts, vx: Math.cos(a) * s, vy: Math.sin(a) * s, spin: Math.random() - .5, rot: 0 };
}
function newWave() {
  wave++;
  for (let i = 0; i < 3 + wave; i++) { const edge = Math.random() < .5; rocks.push(rock(edge ? 0 : Math.random() * W, edge ? Math.random() * H : 0, 50)); }
}
function reset() { ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0 }; rocks = []; shots = []; parts = []; score = 0; lives = 3; wave = 0; inv = 2; newWave(); state = "play"; }
const keys = {}, touch = { on: false, x: 0, y: 0 };
const boom = (x, y, n, col) => { for (let i = 0; i < n; i++) { const a = Math.random() * 7, s = Math.random() * 200; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, col }); } };

function update(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (state !== "play") return;
  let turn = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0), thrust = keys.ArrowUp || keys.KeyW, fire = keys.Space;
  if (touch.on) { // touch: ship steers toward finger, thrusts and fires automatically
    const want = Math.atan2(touch.y - ship.y, touch.x - ship.x), d = Math.atan2(Math.sin(want - ship.a), Math.cos(want - ship.a));
    turn = Math.sign(d) * Math.min(1, Math.abs(d) * 3); thrust = Math.hypot(touch.x - ship.x, touch.y - ship.y) > 120; fire = true;
  }
  ship.a += turn * 4.5 * dt;
  if (thrust) { ship.vx += Math.cos(ship.a) * 320 * dt; ship.vy += Math.sin(ship.a) * 320 * dt; }
  ship.vx *= .99; ship.vy *= .99; ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
  ship.thrust = thrust; inv -= dt; cool -= dt;
  if (fire && cool <= 0) { cool = .2; shots.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14, vx: Math.cos(ship.a) * 600 + ship.vx, vy: Math.sin(ship.a) * 600 + ship.vy, life: 1 }); }
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; wrap(s); }
  for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt; wrap(r); }
  for (const s of shots) for (const r of rocks) if (s.life > 0 && !r.dead && Math.hypot(s.x - r.x, s.y - r.y) < r.r) {
    s.life = 0; r.dead = true; score += r.r > 40 ? 20 : r.r > 20 ? 50 : 100; boom(r.x, r.y, 12, "#ccc");
    if (r.r > 15) rocks.push(rock(r.x, r.y, r.r / 2), rock(r.x, r.y, r.r / 2));
  }
  rocks = rocks.filter(r => !r.dead); shots = shots.filter(s => s.life > 0);
  if (inv <= 0) for (const r of rocks) if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 10) {
    boom(ship.x, ship.y, 30, "#6cf"); lives--;
    if (!lives) { state = "over"; if (score > best) { best = score; try { localStorage.setItem("rock-best", best); } catch {} } }
    else { Object.assign(ship, { x: W / 2, y: H / 2, vx: 0, vy: 0 }); inv = 2.5; }
    break;
  }
  if (!rocks.length) newWave();
}

function draw() {
  ctx.fillStyle = "#05060d"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#ddd"; ctx.lineWidth = 2;
  for (const r of rocks) {
    ctx.beginPath();
    r.pts.forEach((k, i) => { const a = r.rot + i / r.pts.length * Math.PI * 2; ctx.lineTo(r.x + Math.cos(a) * r.r * k, r.y + Math.sin(a) * r.r * k); });
    ctx.closePath(); ctx.stroke();
  }
  ctx.fillStyle = "#ffeb7a"; for (const s of shots) ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  for (const p of parts) { ctx.globalAlpha = p.life / .6; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 2, 2); }
  ctx.globalAlpha = 1;
  if (state === "play" && (inv <= 0 || (inv * 8 | 0) % 2)) {
    ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a); ctx.strokeStyle = "#6cf";
    ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, 9); ctx.lineTo(-6, 0); ctx.lineTo(-10, -9); ctx.closePath(); ctx.stroke();
    if (ship.thrust && Math.random() < .7) { ctx.strokeStyle = "#f93"; ctx.beginPath(); ctx.moveTo(-7, 4); ctx.lineTo(-18, 0); ctx.lineTo(-7, -4); ctx.stroke(); }
    ctx.restore();
  }
  ctx.fillStyle = "#fff"; ctx.font = "600 18px system-ui"; ctx.textAlign = "left";
  if (state === "play") ctx.fillText(`${score}   ${"▲".repeat(lives)}   wave ${wave}`, 16, 30);
  ctx.textAlign = "center";
  if (state !== "play") {
    ctx.font = "700 40px system-ui"; ctx.fillText(state === "over" ? `Score ${score}` : "Rock Blaster", W / 2, H / 2 - 20);
    ctx.font = "500 18px system-ui";
    ctx.fillText("←/→ turn · ↑ thrust · Space fire · touch: hold to steer & fire", W / 2, H / 2 + 20);
    ctx.fillText(`${best ? `Best ${best} · ` : ""}Press Enter or tap to start`, W / 2, H / 2 + 50);
  }
}

let last = 0;
(function loop(now) { update(Math.min(.033, (now - last) / 1000 || 0)); last = now; draw(); requestAnimationFrame(loop); })(0);
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
  if (state !== "play" && (e.code === "Enter" || e.code === "Space")) reset();
});
addEventListener("keyup", e => keys[e.code] = false);
addEventListener("pointerdown", e => { if (state !== "play") return reset(); if (e.pointerType !== "mouse") Object.assign(touch, { on: true, x: e.clientX, y: e.clientY }); });
addEventListener("pointermove", e => { if (touch.on) Object.assign(touch, { x: e.clientX, y: e.clientY }); });
addEventListener("pointerup", () => touch.on = false);
</script>
</body>
</html>
