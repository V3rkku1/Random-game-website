<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Bash</title>
<style>
  html, body { margin: 0; height: 100%; display: grid; place-items: center; background: #0d1021; color: #fff; font: 600 16px system-ui; touch-action: none; }
  canvas { width: min(100vw, 70vh); aspect-ratio: 3 / 4; display: block; background: #151a33; border-radius: 10px; }
</style>
</head>
<body>
<!-- skipped: power-ups, levels beyond endless refills; sound via ../kit.js -->
<canvas id="c" width="480" height="640"></canvas>
<script src="../kit.js"></script>
<script>
const ctx = c.getContext("2d"), W = 480, H = 640, COLS = 8, ROWS = 6, BW = W / COLS, BH = 24;
const hues = [0, 30, 55, 140, 200, 270];
let pad, ball, bricks, lives, score, state = "ready", level;

function build() { bricks = []; for (let r = 0; r < ROWS; r++) for (let i = 0; i < COLS; i++) bricks.push({ x: i * BW, y: 70 + r * BH, r }); }
function serve() { ball = { x: pad.x, y: H - 60, vx: 0, vy: 0, stuck: true }; }
function reset() { pad = { x: W / 2, w: 90 }; lives = 3; score = 0; level = 1; build(); serve(); state = "play"; }
function launch() {
  if (state !== "play") reset();
  if (ball.stuck) { const s = 360 + level * 40; ball.vx = s * (Math.random() - .5); ball.vy = -s; ball.stuck = false; }
}

function update(dt) {
  if (state !== "play") return;
  if (ball.stuck) { ball.x = pad.x; return; }
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.x < 8 || ball.x > W - 8) { ball.vx *= -1; ball.x = Math.max(8, Math.min(W - 8, ball.x)); }
  if (ball.y < 8) { ball.vy = Math.abs(ball.vy); }
  if (ball.vy > 0 && ball.y > H - 48 && ball.y < H - 30 && Math.abs(ball.x - pad.x) < pad.w / 2 + 8) {
    const sp = Math.hypot(ball.vx, ball.vy) * 1.01, a = (ball.x - pad.x) / (pad.w / 2) * 1.1; // edge hits angle out
    ball.vx = sp * Math.sin(a); ball.vy = -sp * Math.cos(a); kit.sfx("bounce");
  }
  if (ball.y > H + 10) { kit.sfx("lose"); if (--lives <= 0) state = "over"; else serve(); }
  for (const b of bricks) {
    if (ball.x > b.x - 8 && ball.x < b.x + BW + 8 && ball.y > b.y - 8 && ball.y < b.y + BH + 8) {
      bricks.splice(bricks.indexOf(b), 1); score += (ROWS - b.r) * 10; kit.sfx("pop", 1 + (ROWS - b.r) * .12);
      const ox = Math.min(ball.x - b.x + 8, b.x + BW + 8 - ball.x), oy = Math.min(ball.y - b.y + 8, b.y + BH + 8 - ball.y);
      if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
      break;
    }
  }
  if (!bricks.length) { kit.sfx("win"); level++; build(); serve(); }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of bricks) { ctx.fillStyle = `hsl(${hues[b.r]} 80% 60%)`; ctx.fillRect(b.x + 2, b.y + 2, BW - 4, BH - 4); }
  ctx.fillStyle = "#e6e9ff"; ctx.fillRect(pad.x - pad.w / 2, H - 40, pad.w, 10);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, 8, 0, 7); ctx.fill();
  ctx.font = "600 18px system-ui"; ctx.textAlign = "left"; ctx.fillText(`Score ${score}`, 12, 30);
  ctx.textAlign = "right"; ctx.fillText(`Lv ${level}  ${"●".repeat(lives)}`, W - 12, 30);
  ctx.textAlign = "center";
  if (state === "ready") ctx.fillText("Move mouse / drag · click or Space to launch", W / 2, H / 2);
  if (state === "over") ctx.fillText(`Game over · ${score} · click to retry`, W / 2, H / 2);
  else if (ball.stuck && state === "play") ctx.fillText("Click / Space to launch", W / 2, H / 2);
}

pad = { x: W / 2, w: 90 }; lives = 3; score = 0; level = 1; build(); serve();
kit.pausable(() => state === "play");
let last = 0;
(function loop(now) { if (!kit.paused) update(Math.min(.03, (now - last) / 1000 || 0)); last = now; draw(); requestAnimationFrame(loop); })(0);

const aim = x => { const r = c.getBoundingClientRect(); pad.x = Math.max(pad.w / 2, Math.min(W - pad.w / 2, (x - r.left) / r.width * W)); };
addEventListener("pointermove", e => aim(e.clientX));
addEventListener("pointerdown", e => { aim(e.clientX); launch(); });
const keys = {};
addEventListener("keydown", e => { keys[e.code] = 1; if (e.code === "Space") { e.preventDefault(); launch(); } });
addEventListener("keyup", e => keys[e.code] = 0);
setInterval(() => { if (kit.paused) return; const d = (keys.ArrowRight || keys.KeyD) - (keys.ArrowLeft || keys.KeyA); if (d) pad.x = Math.max(pad.w / 2, Math.min(W - pad.w / 2, pad.x + d * 9)); }, 16);
</script>
</body>
</html>
