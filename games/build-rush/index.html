<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; overflow: hidden; background: #000; color: #fff; font: 600 14px Inter, system-ui, sans-serif; user-select: none; }
  canvas { display: block; }
  #cross { position: fixed; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 3px #000; border-radius: 1px; }
  #cross::before { left: 9px; top: 0; width: 2px; height: 20px; } #cross::after { top: 9px; left: 0; height: 2px; width: 20px; }
  #hot { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: flex-end; }
  .slot { width: 62px; height: 62px; border-radius: 12px; background: #0009; border: 2px solid #ffffff2a; display: grid; place-items: center; position: relative; transition: transform .12s, border-color .12s, background .12s; }
  .slot svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linejoin: round; }
  .slot small { position: absolute; top: 3px; left: 6px; font-size: 11px; opacity: .7; }
  .slot.on { border-color: #ffd166; transform: translateY(-6px); background: #000c; }
  .slot.on svg { stroke: #ffd166; }
  #mat { margin-left: 10px; padding: 8px 12px; border-radius: 12px; background: #0009; display: flex; gap: 8px; align-items: center; }
  #mat i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; opacity: .35; border: 2px solid transparent; }
  #mat i.on { opacity: 1; border-color: #fff; }
  #top { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .pill { background: #000a; padding: 8px 14px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill b { color: #ffd166; }
  #hint { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); background: #000a; padding: 6px 12px; border-radius: 999px; font-size: 13px; opacity: .9; white-space: nowrap; }
  #hint:empty { display: none; }
  #flash { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); font: 800 40px Inter, sans-serif; text-shadow: 0 4px 20px #000a; pointer-events: none; opacity: 0; }
  #flash.go { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
  .ov { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #12234acc, #000e); backdrop-filter: blur(5px); z-index: 5; overflow: auto; }
  .ov[hidden] { display: none; }
  .box { width: min(92vw, 760px); text-align: center; padding: 20px; animation: pop .4s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  h1 { font-size: clamp(40px, 8vw, 68px); margin: 0; font-weight: 800; letter-spacing: -.04em; background: linear-gradient(90deg, #ffd166, #ff8a5b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #aab4d0; margin: 6px 0 22px; font-weight: 500; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .mode { background: #ffffff10; border: 2px solid #ffffff1c; border-radius: 16px; padding: 18px 14px; cursor: pointer; transition: transform .15s, border-color .15s, background .15s; color: #fff; font: inherit; }
  .mode:hover { transform: translateY(-4px); border-color: #ffd166; background: #ffffff18; }
  .mode b { display: block; font-size: 19px; margin-bottom: 6px; }
  .mode span { color: #aab4d0; font-weight: 500; font-size: 13px; display: block; }
  .mode em { display: block; margin-top: 8px; color: #ffd166; font-style: normal; font-size: 12px; }
  .keys { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px 16px; text-align: left; color: #c8d0e6; font-weight: 500; font-size: 13px; }
  kbd { background: #ffffff22; border-radius: 5px; padding: 1px 6px; font: 700 12px Inter, sans-serif; color: #fff; margin-right: 4px; }
  .btn { margin: 6px; padding: 12px 22px; border-radius: 12px; border: 0; font: 700 15px Inter, sans-serif; cursor: pointer; background: #ffd166; color: #221; }
  .btn.ghost { background: #ffffff1c; color: #fff; }
  .big { font-size: 54px; font-weight: 800; margin: 8px 0; }
  #touchNote { color: #ff9f8a; margin-top: 14px; }
  .set { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; text-align: left; margin: 10px 0 18px; }
  .set label { display: flex; align-items: center; gap: 10px; color: #c8d0e6; white-space: nowrap; }
  .set input[type=range] { flex: 1; accent-color: #ffd166; }
  .set output { min-width: 38px; color: #ffd166; font-variant-numeric: tabular-nums; }
  .set select { font: inherit; background: #ffffff1c; color: #fff; border: 0; border-radius: 8px; padding: 6px 8px; }
  .set select option { color: #000; }
  .box h3 { text-align: left; margin: 8px 0; } .box h3 small { color: #8a94b0; font-weight: 500; }
  .binds { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; margin-bottom: 14px; }
  .bind { display: flex; justify-content: space-between; align-items: center; background: #ffffff10; border: 2px solid transparent; border-radius: 10px; padding: 8px 10px; color: #dde3f3; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .bind:hover { border-color: #ffffff40; } .bind.wait { border-color: #ffd166; } .bind kbd { min-width: 28px; text-align: center; }
</style>
</head>
<body>
<div id="cross"></div>
<div id="top"></div>
<div id="hint"></div>
<div id="flash"></div>
<div id="hot">
  <div class="slot" data-t="pick"><small data-a="pick">E</small><svg viewBox="0 0 32 32"><path d="M6 10 Q16 2 26 10 M16 7 V28"/></svg></div>
  <div class="slot" data-t="wall"><small data-a="wall">Q</small><svg viewBox="0 0 32 32"><rect x="7" y="5" width="18" height="22"/></svg></div>
  <div class="slot" data-t="floor"><small data-a="floor">F</small><svg viewBox="0 0 32 32"><path d="M3 20 L13 13 H29 L19 20 Z"/></svg></div>
  <div class="slot" data-t="ramp"><small data-a="ramp">C</small><svg viewBox="0 0 32 32"><path d="M4 26 H28 V6 Z"/></svg></div>
  <div class="slot" data-t="cone"><small data-a="cone">V</small><svg viewBox="0 0 32 32"><path d="M3 24 L16 8 L29 24 Z M16 8 V24"/></svg></div>
  <div id="mat"><small data-a="mat">T</small><i style="background:#b07a45"></i><i style="background:#b5523b"></i><i style="background:#8d99a8"></i></div>
</div>

<div class="ov" id="menu"><div class="box">
  <h1>BUILD RUSH</h1>
  <div class="sub">Build fast. Edit faster.</div>
  <div class="modes">
    <button class="mode" data-m="free"><b>🏗️ Free Build</b><span>Sandbox. Build anything, practise edits and ramps.</span></button>
    <button class="mode" data-m="climb"><b>🚀 Climb</b><span>Reach the ring 10 floors up. Ramp rush as fast as you can.</span><em id="bestClimb"></em></button>
    <button class="mode" data-m="drill"><b>✂️ Edit Drill</b><span>Copy the glowing edit on your walls. 60 seconds.</span><em id="bestDrill"></em></button>
  </div>
  <div class="keys" id="keyList"></div>
  <button class="btn ghost" id="openSet1" style="margin-top:16px">⚙️ Settings</button>
  <div id="touchNote" hidden>Needs a keyboard and mouse.</div>
</div></div>
<div class="ov" id="pause" hidden><div class="box"><h1>Paused</h1><div class="sub" id="pauseSub"></div>
  <button class="btn" id="resume">Resume</button><button class="btn ghost" id="restart">Restart</button><button class="btn ghost" id="openSet2">⚙️ Settings</button><button class="btn ghost" id="toMenu">Menu</button></div></div>
<div class="ov" id="done" hidden><div class="box"><div class="sub" id="doneT"></div><div class="big" id="doneV"></div><div class="sub" id="doneS"></div>
  <button class="btn" id="again">Play again</button><button class="btn ghost" id="toMenu2">Menu</button></div></div>

<div class="ov" id="settings" hidden><div class="box">
  <h1 style="font-size:44px">Settings</h1>
  <div class="set">
    <label>Sensitivity <input type="range" id="sSens" min="0.1" max="3" step="0.05"><output id="oSens"></output></label>
    <label>Field of view <input type="range" id="sFov" min="60" max="110" step="1"><output id="oFov"></output></label>
    <label>Camera <select id="sCam"><option value="tp">Third person</option><option value="fp">First person</option></select></label>
    <label><input type="checkbox" id="sInv"> Invert mouse Y</label>
  </div>
  <h3>Keybinds <small>click one, then press a key or mouse button 3–5 · Esc cancels</small></h3>
  <div class="binds" id="binds"></div>
  <button class="btn ghost" id="resetBinds">Reset keys</button><button class="btn" id="setDone">Done</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// three.js + hand-rolled AABB/slope physics on a 4m build grid. No physics engine: pieces are boxes or analytic slopes.
const C = 4, V3 = THREE.Vector3, $ = id => document.getElementById(id);
const store = (k, v) => { try { return v === undefined ? localStorage[k] : (localStorage[k] = v); } catch {} };

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement, scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8e8); scene.fog = new THREE.Fog(0x87b8e8, 60, 220);
const camera = new THREE.PerspectiveCamera(78, 1, .05, 500);
scene.add(new THREE.HemisphereLight(0xdcecff, 0x4b6b3a, .55));
const sun = new THREE.DirectionalLight(0xfff0d8, .9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 160 }); sun.shadow.bias = -.0004;
scene.add(sun, sun.target);

function tex(w, h, paint, rep = 1) {
  const cv = Object.assign(document.createElement("canvas"), { width: w, height: h }); paint(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 4; return t;
}
// ground with build-grid lines every cell
const groundTex = tex(128, 128, (x, w) => { x.fillStyle = "#4a7f37"; x.fillRect(0, 0, w, w); for (let i = 0; i < 400; i++) { x.fillStyle = `rgba(${Math.random() < .5 ? "255,255,255" : "0,40,0"},.05)`; x.fillRect(Math.random() * w, Math.random() * w, 3, 3); } x.strokeStyle = "rgba(255,255,255,.22)"; x.lineWidth = 2; x.strokeRect(1, 1, w - 2, w - 2); }, 100);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// scenery: mountains + trees far away
for (let i = 0; i < 26; i++) {
  const a = i / 26 * Math.PI * 2, r = 150 + Math.random() * 40, h = 30 + Math.random() * 50;
  const m = new THREE.Mesh(new THREE.ConeGeometry(25 + Math.random() * 20, h, 6), new THREE.MeshStandardMaterial({ color: [0x6c7f9a, 0x7b8da6, 0x5f7390][i % 3], flatShading: true }));
  m.position.set(Math.cos(a) * r, h / 2 - 2, Math.sin(a) * r); scene.add(m);
}
const trunkG = new THREE.CylinderGeometry(.25, .35, 2, 6), leafG = new THREE.ConeGeometry(1.8, 4.5, 7), trunkM = new THREE.MeshStandardMaterial({ color: 0x6b4a2b }), leafM = new THREE.MeshStandardMaterial({ color: 0x3d7d3a, flatShading: true });
for (let i = 0; i < 120; i++) {
  const a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 70, x = Math.cos(a) * r, z = Math.sin(a) * r, s = .8 + Math.random() * .8;
  const t = new THREE.Mesh(trunkG, trunkM), l = new THREE.Mesh(leafG, leafM);
  t.position.set(x, s, z); l.position.set(x, 2 + 2.2 * s, z); t.scale.setScalar(s); l.scale.setScalar(s); l.castShadow = true; scene.add(t, l);
}

// materials: wood planks / brick / metal panels, all canvas-painted
const MATS = [
  tex(128, 128, (x, w) => { x.fillStyle = "#b07a45"; x.fillRect(0, 0, w, w); for (let i = 0; i < 4; i++) { x.fillStyle = i % 2 ? "#a46e3c" : "#b9844f"; x.fillRect(0, i * 32, w, 30); x.fillStyle = "#6b4523"; x.fillRect(0, i * 32 + 30, w, 2); for (let k = 0; k < 6; k++) { x.fillStyle = "rgba(90,55,25,.25)"; x.fillRect(Math.random() * w, i * 32 + Math.random() * 28, 20 + Math.random() * 40, 1); } } x.fillStyle = "#5a3a1c"; x.fillRect(0, 0, 3, w); x.fillRect(w - 3, 0, 3, w); }),
  tex(128, 128, (x, w) => { x.fillStyle = "#d8cbb8"; x.fillRect(0, 0, w, w); for (let r = 0; r < 8; r++) for (let c = -1; c < 4; c++) { x.fillStyle = `hsl(${8 + Math.random() * 10},${45 + Math.random() * 15}%,${38 + Math.random() * 10}%)`; x.fillRect(c * 40 + (r % 2) * 20 + 2, r * 16 + 2, 36, 12); } }),
  tex(128, 128, (x, w) => { const g = x.createLinearGradient(0, 0, w, w); g.addColorStop(0, "#a4afbd"); g.addColorStop(1, "#7f8a98"); x.fillStyle = g; x.fillRect(0, 0, w, w); x.strokeStyle = "#5d6673"; x.lineWidth = 3; x.strokeRect(2, 2, w - 4, w - 4); x.beginPath(); x.moveTo(0, w / 2); x.lineTo(w, w / 2); x.stroke(); x.fillStyle = "#cfd6df"; for (const [a, b] of [[10, 10], [w - 10, 10], [10, w - 10], [w - 10, w - 10], [10, w / 2 - 8], [w - 10, w / 2 + 8]]) { x.beginPath(); x.arc(a, b, 3, 0, 7); x.fill(); } }),
].map(map => new THREE.MeshStandardMaterial({ map, roughness: .8 }));
MATS[2].metalness = .4; MATS[2].roughness = .45;
const MAT_COL = [0xb07a45, 0xb5523b, 0x8d99a8];
const ghostMat = new THREE.MeshBasicMaterial({ color: 0x5ab0ff, transparent: true, opacity: .35, depthWrite: false });
const ghostBad = new THREE.MeshBasicMaterial({ color: 0xff5a5a, transparent: true, opacity: .25, depthWrite: false });

// ---------- pieces ----------
// wall: axis 'x' spans x at z=k*C (cell col i); axis 'z' spans z at x=k*C (cell row i). Tiles 3x3, idx=row*3+col.
// floor: cell (i,j,k) at y=j*C, tiles 2x2 idx=b*2+a. ramp: cell (i,j,k) rising toward dir (0:+x 1:+z 2:-x 3:-z). cone: cell (i,j,k).
const pieces = new Map(), DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]], ROT = [Math.PI / 2, 0, -Math.PI / 2, Math.PI];
const RL = C * Math.SQRT2;
const keyOf = p => p.kind === "wall" ? `w${p.axis}${p.i},${p.j},${p.k}` : p.kind === "floor" ? `f${p.i},${p.j},${p.k}` : `i${p.i},${p.j},${p.k}`; // ramps+cones share the cell interior
const boxG = {}; const bg = (w, h, d) => boxG[`${w},${h},${d}`] ||= new THREE.BoxGeometry(w, h, d);
function buildMesh(p, mat) {
  const g = new THREE.Group(), removed = p.removed || new Set(), add = (geo, x, y, z, idx) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; m.userData = { piece: p, idx }; g.add(m); return m;
  };
  if (p.kind === "wall") {
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) if (!removed.has(r * 3 + c)) add(bg(C / 3, C / 3, .25), (c - 1) * C / 3, (r - 1) * C / 3, 0, r * 3 + c);
    if (p.axis === "x") g.position.set(p.i * C + C / 2, p.j * C + C / 2, p.k * C);
    else { g.position.set(p.k * C, p.j * C + C / 2, p.i * C + C / 2); g.rotation.y = -Math.PI / 2; }
  } else if (p.kind === "floor") {
    for (let b = 0; b < 2; b++) for (let a = 0; a < 2; a++) if (!removed.has(b * 2 + a)) add(bg(C / 2, .2, C / 2), (a - .5) * C / 2, 0, (b - .5) * C / 2, b * 2 + a);

  } else if (p.kind === "ramp") {
    const slab = new THREE.Group(); slab.rotation.x = -Math.PI / 4; g.add(slab); g.userData.slab = slab;
    const m = new THREE.Mesh(bg(C, .2, RL), mat); m.castShadow = m.receiveShadow = true; m.userData = { piece: p }; slab.add(m);
    g.position.set(p.i * C + C / 2, p.j * C + C / 2, p.k * C + C / 2); g.rotation.y = ROT[p.dir];
  } else {
    const m = new THREE.Mesh(G_CONE, mat); m.castShadow = m.receiveShadow = true; m.userData = { piece: p }; m.position.y = C / 4; m.rotation.y = Math.PI / 4; g.add(m);

}
const G_CONE = new THREE.ConeGeometry(C / Math.SQRT2, C / 2, 4, 1, false);
// collision boxes [x0,y0,z0,x1,y1,z1] for walls and floors
function boxesOf(p) {
  const out = [], rm = p.removed;
  if (p.kind === "wall") for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    if (rm.has(r * 3 + c)) continue;
    const s0 = p.i * C + c * C / 3, y0 = p.j * C + r * C / 3, n = p.k * C;

  }
  if (p.kind === "floor") for (let b = 0; b < 2; b++) for (let a = 0; a < 2; a++) {
    if (rm.has(b * 2 + a)) continue;
    const x0 = p.i * C + a * C / 2, z0 = p.k * C + b * C / 2;

}
// analytic surface height for ramps/cones at (x,z), or null if outside its footprint
function surfaceAt(p, x, z) {
  const u = (x - p.i * C) / C, v = (z - p.k * C) / C;
  if (u < 0 || u > 1 || v < 0 || v > 1) return null;

const root = new THREE.Group(); scene.add(root);
const anims = [];
function addPiece(p, anim = true) {

function rebuild(p) { root.remove(p.mesh); p.boxes = boxesOf(p); p.mesh = buildMesh(p, MATS[p.mat]); root.add(p.mesh); }
function removePiece(p) { root.remove(p.mesh); pieces.delete(p.key); }
function clearAll() { for (const p of [...pieces.values()]) removePiece(p); }

// ---------- settings & keybinds (saved in localStorage) ----------
const ACTIONS = { forward: ["Move forward", "KeyW"], back: ["Move back", "KeyS"], left: ["Move left", "KeyA"], right: ["Move right", "KeyD"], jump: ["Jump", "Space"], sprint: ["Sprint", "ShiftLeft"],
  wall: ["Wall", "KeyQ"], floor: ["Floor", "KeyF"], ramp: ["Ramp", "KeyC"], cone: ["Cone", "KeyV"], pick: ["Pickaxe", "KeyE"], edit: ["Edit", "KeyG"], mat: ["Material", "KeyT"], cam: ["Switch camera", "KeyP"] };
const SET = { sens: 1, fov: 78, cam: "tp", inv: false, bind: {} };
try { Object.assign(SET, JSON.parse(store("brSet") || "{}")); } catch {}
const saveSet = () => store("brSet", JSON.stringify(SET));
const bind = a => SET.bind[a] || ACTIONS[a][1];
const held = a => !!keys[bind(a)];
const keyName = c => ({ Space: "Space", ShiftLeft: "Shift", ShiftRight: "R-Shift", ControlLeft: "Ctrl", AltLeft: "Alt", Tab: "Tab", CapsLock: "Caps", Mouse1: "Mouse 3", Mouse3: "Mouse 4", Mouse4: "Mouse 5", ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→" })[c] || c.replace(/^Key|^Digit|^Numpad/, "");
let capturing = null, setFrom = "menu";
function setBind(a, code) {
  for (const k in ACTIONS) if (k !== a && bind(k) === code) SET.bind[k] = bind(a); // swap instead of leaving a duplicate
  SET.bind[a] = code; saveSet(); labels();
}
function labels() {
  const k = a => keyName(bind(a));
  document.querySelectorAll("small[data-a]").forEach(e => e.textContent = k(e.dataset.a));
  $("keyList").innerHTML = [`<kbd>${k("forward")}${k("left")}${k("back")}${k("right")}</kbd>move <kbd>${k("jump")}</kbd>jump <kbd>${k("sprint")}</kbd>sprint`,

$("toMenu").onclick = $("toMenu2").onclick = showMenu;
function showMenu() {
  mode = "menu"; ["pause", "done"].forEach(k => $(k).hidden = true); $("menu").hidden = false;
  const c = +store("brClimb"), d = store("brDrill");
  $("bestClimb").textContent = c ? `Best ${c.toFixed(2)}s` : ""; $("bestDrill").textContent = d ? `Best ${d}` : "";
}
if (matchMedia("(pointer: coarse)").matches) $("touchNote").hidden = false;

// ---------- third-person character ----------
const hero = new THREE.Group(), limb = {};
{
  const part = (w, h, d, c, x, y, z, pivotY) => { // limbs hang from a pivot so they can swing
    const piv = new THREE.Group(); piv.position.set(x, pivotY ?? y, z);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: c, roughness: .8 }));
    m.position.y = pivotY !== undefined ? y - pivotY : 0; m.castShadow = true; piv.add(m); hero.add(piv); return piv;
  };
  part(.5, .62, .3, 0xff8a3d, 0, 1.12, 0);                       // jacket
  part(.36, .36, .34, 0xf0c49a, 0, 1.62, 0);                     // head
  part(.4, .14, .4, 0x2d3a5a, 0, 1.84, 0);                       // cap
  part(.26, .06, .18, 0x2d3a5a, 0, 1.79, -.24);                  // cap brim (faces forward = -z)
  part(.3, .26, .1, 0x5a4630, 0, 1.15, .2);                      // backpack
  limb.ll = part(.2, .7, .22, 0x2d3a5a, -.13, .42, 0, .8); limb.rl = part(.2, .7, .22, 0x2d3a5a, .13, .42, 0, .8);
  limb.la = part(.14, .58, .16, 0xff8a3d, -.34, 1.12, 0, 1.38); limb.ra = part(.14, .58, .16, 0xff8a3d, .34, 1.12, 0, 1.38);
  scene.add(hero);
}
let camDist = 0;
const camRay = new THREE.Raycaster();
function placeCamera(moving) {
  const pivot = new V3(P.x, P.y + 1.55, P.z);
  if (SET.cam === "fp") { camDist = 0; camera.position.set(P.x, P.y + EYE + (moving ? Math.sin(bob) * .05 : 0), P.z); return; }
  const dir = look(), right = new V3(Math.cos(P.yaw), 0, -Math.sin(P.yaw));
  const want = pivot.clone().addScaledVector(dir, -3.4).addScaledVector(right, .8).add(new V3(0, .35, 0));
  const off = want.clone().sub(pivot), full = off.length();
  camRay.set(pivot, off.normalize()); camRay.far = full;
  const hit = camRay.intersectObjects(root.children.filter(o => o !== ghost && o !== drill?.mark), true)[0];
  const d = hit ? Math.max(.4, hit.distance - .25) : full; // pull in when a build is behind you
  camera.position.copy(pivot).addScaledVector(off, d); camera.position.y = Math.max(.3, camera.position.y);
  camDist = d;
}
function animateHero(moving, dt) {
  hero.visible = SET.cam === "tp" && mode !== "menu";
  hero.position.set(P.x, P.y, P.z); hero.rotation.y = P.yaw;
  const sw = moving ? Math.sin(bob) * .7 : 0, air = P.ground ? 0 : .5;
  limb.ll.rotation.x = sw + air; limb.rl.rotation.x = -sw + air * .3;
  limb.la.rotation.x = -sw * .8 - (holding ? 1.2 : 0); limb.ra.rotation.x = sw * .8 - (holding || editing ? 1.3 : 0);
}

// ---------- loop ----------
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
let last = performance.now(), bob = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const playing = ["free", "climb", "drill"].includes(mode) && locked();
  if (playing) { physics(dt); modeTick(dt); }
  const moving = playing && P.ground && (held("forward") || held("back") || held("left") || held("right"));
  bob += moving ? dt * 11 : 0;
  camera.rotation.set(P.pitch, P.yaw, 0, "YXZ");
  placeCamera(moving); animateHero(moving, dt);
  if (mode === "menu") { P.yaw += dt * .08; camera.position.set(Math.sin(now / 9000) * 30, 14, Math.cos(now / 9000) * 30); camera.lookAt(0, 6, 0); }
  sun.position.set(camera.position.x + 30, 60, camera.position.z + 20); sun.target.position.set(camera.position.x, 0, camera.position.z);
  if (playing) {
    updateGhost();
    if (editing && !holding) { const h = editHit() || null; if (h !== editing.hover) { editing.hover = h; refreshTiles(); } }
    if (ghost) for (const m of ghost.children) if (m.material) m.material.opacity = (ghost.userData.taken ? .18 : .3) + Math.sin(now / 160) * .06;
  }
  for (let i = anims.length - 1; i >= 0; i--) { const a = anims[i]; a.t += dt / a.d; a.f(Math.min(1, a.t)); if (a.t >= 1) anims.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.v.y -= 14 * dt; p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += dt * 6; p.life -= dt;
    p.m.scale.setScalar(Math.max(0, p.life)); if (p.life <= 0) { scene.remove(p.m); parts.splice(i, 1); }
  }
  renderer.render(scene, camera);
});
// menu backdrop: a little demo fort
function demoFort() {
  for (let d = 0; d < 4; d++) { addPiece({ ...wallOnEdge(0, 0, d, 0), mat: 1 }, false); addPiece({ ...wallOnEdge(0, 0, d, 1), mat: 0, removed: new Set(d % 2 ? [4] : [1, 4]) }, false); }
  addPiece({ kind: "floor", i: 0, j: 1, k: 0, mat: 2 }, false); addPiece({ kind: "cone", i: 0, j: 2, k: 0, mat: 0 }, false);
  for (let n = 1; n <= 4; n++) addPiece({ kind: "ramp", i: n, j: n - 1, k: -1, dir: 0, mat: n % 3 }, false);
  addPiece({ kind: "floor", i: 5, j: 4, k: -1, mat: 2 }, false);
}
setTool("wall"); setMat(0); demoFort(); applySet(); labels(); showMenu();

// self-checks: tile boxes, ramp surface ends, wall edge mapping
console.assert(boxesOf({ kind: "wall", axis: "x", i: 0, j: 0, k: 0, removed: new Set([4]) }).length === 8, "wall tiles");
console.assert(Math.abs(surfaceAt({ kind: "ramp", i: 0, j: 0, k: 0, dir: 0 }, 3.99, 2) - 4.13) < .05, "ramp top");
console.assert(wallOnEdge(0, 0, 0, 0).k === 1 && wallOnEdge(0, 0, 3, 0).k === 0, "wall edges");
</script>
