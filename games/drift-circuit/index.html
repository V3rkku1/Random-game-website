<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drift Circuit</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #9ad0f5; color: #fff; font: 700 16px system-ui, sans-serif; user-select: none; touch-action: none; }
  canvas#c { display: block; }
  .hud { position: fixed; text-shadow: 0 2px 6px #000a; pointer-events: none; }
  #tl { top: 12px; left: 16px; line-height: 1.35; }
  #tl b { font-size: 30px; }
  #tr { top: 12px; right: 16px; text-align: right; line-height: 1.35; }
  #spd { bottom: 18px; right: 20px; font: 900 44px system-ui; text-align: right; }
  #spd small { font-size: 16px; }
  #drift { top: 26%; left: 0; right: 0; text-align: center; font: 900 28px system-ui; color: #ffd166; opacity: 0; transition: opacity .2s; }
  #big { inset: 0; display: grid; place-items: center; font: 900 min(18vw, 110px) system-ui; }
  #map { position: fixed; left: 12px; bottom: 12px; width: 150px; height: 150px; background: #0005; border-radius: 12px; pointer-events: none; }
  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 14px; pointer-events: none; }
  #touch div { display: flex; gap: 12px; }
  #touch button { pointer-events: auto; width: 74px; height: 74px; border-radius: 50%; border: 0; background: #fff3; color: #fff; font: 900 20px system-ui; backdrop-filter: blur(4px); }
  body.touch #touch { display: flex; } body.touch #map { bottom: auto; top: 90px; width: 110px; height: 110px; } body.touch #spd { bottom: 110px; }
  #ov { position: fixed; inset: 0; display: grid; place-items: center; background: #0006; backdrop-filter: blur(3px); }
  #ov[hidden] { display: none; }
  #ov > div { background: #1d2433ee; padding: 26px 32px; border-radius: 18px; text-align: center; max-width: 440px; margin: 16px; }
  #ov h1 { margin: 0 0 8px; font-size: 34px; }
  #ov p { color: #c9d3e6; line-height: 1.55; margin: 0 0 16px; font-weight: 500; }
  #ov button { font: 800 17px system-ui; border: 0; border-radius: 12px; padding: 12px 26px; cursor: pointer; background: #ffd166; color: #3a2a00; }
</style>
</head>
<body>
<!-- three.js r128; arcade car model (forward/lateral velocity split) instead of a physics engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div class="hud" id="tl"></div>
<div class="hud" id="tr"></div>
<div class="hud" id="spd"></div>
<div class="hud" id="drift"></div>
<div class="hud" id="big"></div>
<canvas id="map" width="300" height="300"></canvas>
<div id="touch"><div><button data-k="L">◀</button><button data-k="R">▶</button></div><div><button data-k="B">BRK</button><button data-k="H">DRIFT</button></div></div>
<div id="ov"><div><h1 id="ovT">Drift Circuit</h1>
  <p id="ovP">3 laps against 3 rivals.<br>↑/W gas · ↓/S brake · ←→/AD steer · Space handbrake to drift<br>Drifting builds boost — it kicks in when you straighten out.<br>On touch the car accelerates by itself.</p>
  <button id="go">Race</button></div></div>
<script>
const LAPS = 3, N = 900, HALF = 7.5;

// ---------- renderer & scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.domElement.id = "c";
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ad0f5);
scene.fog = new THREE.Fog(0x9ad0f5, 120, 420);
const camera = new THREE.PerspectiveCamera(65, 1, .1, 800);
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
resize(); addEventListener("resize", resize);
scene.add(new THREE.HemisphereLight(0xe8f4ff, 0x4a6b3a, .75));
const sun = new THREE.DirectionalLight(0xfff0d8, .95);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 200 });
scene.add(sun, sun.target);

const canvasTex = (w, h, draw, rep) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } return t; };

// ---------- track
const ctrl = [[0, 0], [110, -10], [190, 30], [215, 110], [175, 165], [110, 140], [70, 190], [-10, 225], [-95, 195], [-115, 120], [-55, 85], [-125, 30], [-95, -45], [-40, -40]];
const curve = new THREE.CatmullRomCurve3(ctrl.map(([x, z]) => new THREE.Vector3(x, 0, z)), true, "centripetal");
const P = curve.getSpacedPoints(N).slice(0, N), T = P.map((_, i) => P[(i + 1) % N].clone().sub(P[(i - 1 + N) % N]).normalize());
const Nrm = T.map(t => new THREE.Vector3(-t.z, 0, t.x)); // left-pointing normal
const LEN = curve.getLength(), SEG = LEN / N;
const curv = P.map((_, i) => { const a = T[(i + N - 12) % N], b = T[(i + 12) % N]; return Math.acos(Math.max(-1, Math.min(1, a.dot(b)))); });

function ribbon(off0, off1, y, mat, vScale) { // strip between two lateral offsets along the whole loop
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const k = i % N, p = P[k], n = Nrm[k];
    pos.push(p.x + n.x * off0, y, p.z + n.z * off0, p.x + n.x * off1, y, p.z + n.z * off1);
    uv.push(0, i * SEG / vScale, 1, i * SEG / vScale);
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.receiveShadow = true; scene.add(m); return m;
}
const asphalt = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = "#4a4d55"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) { const v = 60 + Math.random() * 40; x.fillStyle = `rgb(${v},${v},${v + 6})`; x.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5); }
  x.fillStyle = "#e8e8e8"; x.fillRect(w / 2 - 3, 0, 6, h * .45); // centre dash
  x.fillRect(6, 0, 5, h); x.fillRect(w - 11, 0, 5, h);
}, true);
const curb = canvasTex(16, 64, (x) => { x.fillStyle = "#e63946"; x.fillRect(0, 0, 16, 32); x.fillStyle = "#f8f8f8"; x.fillRect(0, 32, 16, 32); }, true);
ribbon(-HALF, HALF, .03, new THREE.MeshStandardMaterial({ map: asphalt, roughness: .9 }), 12);
ribbon(HALF, HALF + 1.2, .05, new THREE.MeshStandardMaterial({ map: curb, roughness: .7 }), 4);
ribbon(-HALF - 1.2, -HALF, .05, new THREE.MeshStandardMaterial({ map: curb, roughness: .7 }), 4);
const grassTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = "#5f9a45"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { x.fillStyle = `hsl(${95 + Math.random() * 20} ${35 + Math.random() * 20}% ${30 + Math.random() * 15}%)`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}, true);
grassTex.repeat.set(120, 120);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(50, 0, 90); ground.receiveShadow = true; scene.add(ground);

// start/finish: checkered strip + gantry
const checker = canvasTex(128, 16, (x) => { for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++) { x.fillStyle = (i + j) % 2 ? "#111" : "#fff"; x.fillRect(i * 8, j * 8, 8, 8); } });
const line = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, 2), new THREE.MeshStandardMaterial({ map: checker }));
line.rotation.x = -Math.PI / 2; line.position.copy(P[0]).setY(.06); line.rotation.z = Math.atan2(T[0].x, T[0].z); scene.add(line);
const gantry = new THREE.Group(), gm = new THREE.MeshStandardMaterial({ color: 0x2b2d42 });
for (const s of [-1, 1]) { const post = new THREE.Mesh(new THREE.BoxGeometry(.6, 7, .6), gm); post.position.set(s * (HALF + 2), 3.5, 0); post.castShadow = true; gantry.add(post); }
const banner = new THREE.Mesh(new THREE.BoxGeometry(HALF * 2 + 4.6, 1.4, .4), new THREE.MeshStandardMaterial({ map: canvasTex(512, 64, (x, w, h) => { x.fillStyle = "#e63946"; x.fillRect(0, 0, w, h); x.fillStyle = "#fff"; x.font = "900 44px system-ui"; x.textAlign = "center"; x.fillText("DRIFT CIRCUIT", w / 2, 48); }) }));
banner.position.y = 6.6; gantry.add(banner);
gantry.position.copy(P[0]); gantry.rotation.y = Math.atan2(T[0].x, T[0].z); scene.add(gantry);

// nearest track sample; `hint` restricts the search to a window for speed
function nearest(x, z, hint) {
  let best = 1e9, bi = 0;
  const from = hint == null ? 0 : hint - 40, to = hint == null ? N : hint + 40;
  for (let j = from; j < to; j++) { const i = (j + N) % N, d = (P[i].x - x) ** 2 + (P[i].z - z) ** 2; if (d < best) { best = d; bi = i; } }
  return [bi, Math.sqrt(best)];
}
// scenery: trees, tyre stacks, grandstand
{
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(.35, .5, 3, 6), new THREE.MeshStandardMaterial({ color: 0x6b4423 }), 260);
  const crown = new THREE.InstancedMesh(new THREE.ConeGeometry(2.6, 7, 7), new THREE.MeshStandardMaterial({ color: 0x2f6b3a, flatShading: true }), 260);
  const o = new THREE.Object3D(); let n = 0;
  while (n < 260) {
    const x = -260 + Math.random() * 620, z = -180 + Math.random() * 540;
    if (nearest(x, z)[1] < HALF + 14) continue;
    const s = .7 + Math.random() * .8;
    o.position.set(x, 1.5 * s, z); o.scale.setScalar(s); o.updateMatrix(); trunk.setMatrixAt(n, o.matrix);
    o.position.y = 6 * s; o.updateMatrix(); crown.setMatrixAt(n, o.matrix); n++;
  }
  crown.castShadow = trunk.castShadow = true; scene.add(trunk, crown);
  const tyre = new THREE.InstancedMesh(new THREE.TorusGeometry(.45, .2, 6, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }), 400);
  let k = 0;
  for (let i = 0; i < N && k < 400; i += 6) if (curv[i] > .5) for (const side of [-1, 1]) {
    const p = P[i].clone().addScaledVector(Nrm[i], side * (HALF + 6));
    for (let h = 0; h < 2 && k < 400; h++) { o.position.set(p.x, .2 + h * .4, p.z); o.rotation.set(Math.PI / 2, 0, 0); o.scale.setScalar(1); o.updateMatrix(); tyre.setMatrixAt(k++, o.matrix); }
  }
  tyre.count = k; scene.add(tyre);
  const stand = new THREE.Mesh(new THREE.BoxGeometry(40, 6, 8), new THREE.MeshStandardMaterial({ color: 0x8d99ae }));
  stand.position.copy(P[20]).addScaledVector(Nrm[20], -(HALF + 16)).setY(3); stand.rotation.y = Math.atan2(T[20].x, T[20].z) + Math.PI / 2; stand.castShadow = true; scene.add(stand);
}

// ---------- cars
function makeCar(color) {
  const g = new THREE.Group(), paint = new THREE.MeshStandardMaterial({ color, roughness: .35, metalness: .4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, .55, 4.2), paint); body.position.y = .55; body.castShadow = true;
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.8, .3, 1), paint); nose.position.set(0, .42, 2.4);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, .5, 1.9), new THREE.MeshStandardMaterial({ color: 0x1b2330, roughness: .1, metalness: .6 }));
  cabin.position.set(0, 1.05, -.25); cabin.castShadow = true;
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.9, .08, .45), new THREE.MeshStandardMaterial({ color: 0x111111 })); wing.position.set(0, 1.15, -1.95);
  for (const s of [-.6, .6]) { const st = new THREE.Mesh(new THREE.BoxGeometry(.08, .35, .2), wing.material); st.position.set(s, .95, -1.95); g.add(st); }
  const lights = new THREE.MeshBasicMaterial({ color: 0xfff6d0 }), tail = new THREE.MeshBasicMaterial({ color: 0xff2b2b });
  for (const s of [-.65, .65]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(.4, .12, .05), lights); hl.position.set(s, .55, 2.9); g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(.4, .12, .05), tail); tl.position.set(s, .6, -2.12); g.add(tl);
  }
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(.35, .01, 4.22), new THREE.MeshStandardMaterial({ color: 0xffffff })); stripe.position.y = .83;
  g.add(body, nose, cabin, wing, stripe);
  g.wheels = [];
  const wg = new THREE.CylinderGeometry(.38, .38, .32, 14), wm = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: .8 });
  for (const [x, z] of [[-.98, 1.35], [.98, 1.35], [-.98, -1.35], [.98, -1.35]]) {
    const pivot = new THREE.Group(), w = new THREE.Mesh(wg, wm);
    w.rotation.z = Math.PI / 2; w.castShadow = true; pivot.add(w); pivot.position.set(x, .38, z); g.add(pivot); g.wheels.push(pivot);
  }
  scene.add(g); return g;
}
const player = { mesh: makeCar(0x3a86ff), x: 0, z: 0, h: 0, vx: 0, vz: 0, idx: 0, prog: 0, boost: 0, drift: 0 };
const rivals = [0xe63946, 0xffb703, 0x8338ec].map((c, i) => ({ mesh: makeCar(c), s: 0, lane: 0, skill: [.93, .965, 1][i], phase: Math.random() * 6, x: 0, z: 0, h: 0, v: 0, prog: 0 }));

// skid marks: pooled dark quads
const SKIDS = 800, skid = new THREE.InstancedMesh(new THREE.PlaneGeometry(.35, .9), new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: .45, depthWrite: false }), SKIDS);
skid.count = 0; scene.add(skid);
let skidI = 0; const so = new THREE.Object3D();
function addSkid(x, z, h) {
  so.position.set(x, .07, z); so.rotation.set(-Math.PI / 2, 0, h); so.updateMatrix();
  skid.setMatrixAt(skidI, so.matrix); skidI = (skidI + 1) % SKIDS; skid.count = Math.max(skid.count, skidI); skid.instanceMatrix.needsUpdate = true;
}

// ---------- race state
let state = "menu", countdown = 0, raceT = 0, lapT = 0, lapTimes = [], bestLap = 0, bestRace = 0, finishOrder = [], t = 0;
try { bestLap = +localStorage.getItem("drift-lap") || 0; bestRace = +localStorage.getItem("drift-race") || 0; } catch {}
function place(car, s, off) {
  const i = ((Math.floor(s) % N) + N) % N, p = P[i];
  car.x = p.x + Nrm[i].x * off; car.z = p.z + Nrm[i].z * off; car.h = Math.atan2(T[i].x, T[i].z);
}
function reset() {
  place(player, -16, -3); Object.assign(player, { vx: 0, vz: 0, idx: N - 16, prog: -16, boost: 0, drift: 0, lap: 0 });
  const grid = [[-6, 3], [-6, -3], [-16, 3]]; // 2x2 grid, player starts back-left
  rivals.forEach((r, k) => { [r.s, r.lane] = grid[k]; r.v = 0; place(r, r.s, r.lane); r.prog = r.s; r.done = false; });
  raceT = lapT = 0; lapTimes = []; finishOrder = []; skid.count = 0; skidI = 0;
}
function startRace() { reset(); state = "count"; countdown = 3.5; ov.hidden = true; }

// ---------- input
const keys = {};
addEventListener("keydown", e => { keys[e.code] = true; if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault(); if (e.code === "Enter" && !ov.hidden) startRace(); });
addEventListener("keyup", e => keys[e.code] = false);
const touchK = {};
let touchMode = false;
document.querySelectorAll("#touch button").forEach(b => {
  b.onpointerdown = e => { e.preventDefault(); touchK[b.dataset.k] = true; };
  b.onpointerup = b.onpointerleave = b.onpointercancel = () => touchK[b.dataset.k] = false;
});
addEventListener("touchstart", () => { if (!touchMode) { touchMode = true; document.body.classList.add("touch"); } }, { once: true });
const input = () => ({
  gas: keys.ArrowUp || keys.KeyW || (touchMode && !touchK.B) ? 1 : 0,
  brake: keys.ArrowDown || keys.KeyS || touchK.B ? 1 : 0,
  steer: (keys.ArrowLeft || keys.KeyA || touchK.L ? 1 : 0) - (keys.ArrowRight || keys.KeyD || touchK.R ? 1 : 0),
  hand: keys.Space || touchK.H,
});

// ---------- simulation
function updatePlayer(dt, ctl) {
  const c = player, fx = Math.sin(c.h), fz = Math.cos(c.h);
  let vf = c.vx * fx + c.vz * fz, vl = c.vx * fz - c.vz * fx; // lateral: + = right side
  const [idx, dist] = nearest(c.x, c.z, c.idx);
  const off = dist > HALF + 1.2, top = (off ? 22 : 52) + (c.boost > 0 ? 12 : 0);
  if (ctl.gas) vf += (c.boost > 0 ? 34 : 24) * dt * Math.max(0, 1 - vf / top);
  if (ctl.brake) vf -= (vf > 0 ? 36 : 12) * dt;
  vf = Math.max(-10, vf) * (1 - (off ? 1.6 : .25) * dt);
  if (vf > top) vf -= (vf - top) * 2 * dt;
  const speedK = Math.min(1, Math.abs(vf) / 12);
  const drifting = ctl.hand && vf > 12;
  // velocity keeps its world direction while the body rotates; grip then pulls it back in line -> slip angle
  const wvx = fx * vf + fz * vl, wvz = fz * vf - fx * vl;
  c.h += ctl.steer * (drifting ? 2.6 : 1.9) * dt * speedK * Math.sign(vf) * (1 - Math.min(.35, vf / 160));
  const nfx = Math.sin(c.h), nfz = Math.cos(c.h);
  vf = wvx * nfx + wvz * nfz; vl = wvx * nfz - wvz * nfx;
  const grip = drifting ? 1.8 : off ? 4 : 9 - Math.min(3.5, Math.abs(ctl.steer) * vf / 16);
  const vl0 = Math.abs(vl);
  vl *= Math.exp(-grip * dt);
  vf += (vl0 - Math.abs(vl)) * (drifting ? .5 : .3) * Math.sign(vf || 1); // tyres turn some sideways speed back into forward
  if (drifting) vf *= 1 - .2 * dt;
  c.vx = nfx * vf + nfz * vl; c.vz = nfz * vf - nfx * vl;
  c.x += c.vx * dt; c.z += c.vz * dt;
  // drift scoring -> boost
  const sliding = Math.abs(vl) > 3.5 && vf > 14 && !off;
  if (sliding) { c.drift += dt * Math.abs(vl); if (Math.random() < .9) for (const k of [2, 3]) { const w = c.mesh.wheels[k].getWorldPosition(new THREE.Vector3()); addSkid(w.x, w.z, c.h); } }
  else if (c.drift > 0) { c.boost = Math.min(3, c.drift / 6); flashDrift(`BOOST ${c.boost.toFixed(1)}s`); c.drift = 0; }
  c.boost = Math.max(0, c.boost - dt);
  if (sliding) flashDrift(`DRIFT ${Math.floor(c.drift * 10)}`);
  // progress along the loop
  let d = idx - c.idx; if (d < -N / 2) d += N; if (d > N / 2) d -= N;
  c.prog += d; c.idx = idx;
  c.vf = vf; c.vl = vl; c.off = off;
}
function updateRival(r, dt) {
  const i = ((Math.floor(r.s) % N) + N) % N;
  let look = 0; for (let k = 8; k < 70; k += 6) look = Math.max(look, curv[(i + k) % N]);
  const target = (state === "race" ? 60 : 0) * r.skill * (1 - Math.min(.55, look * .5));
  r.v += Math.max(-30, Math.min(20, (target - r.v) * 1.5)) * dt;
  r.s += r.v * dt / SEG; r.prog = r.s;
  const lane = r.lane + Math.sin(t * .3 + r.phase) * 2.5;
  const j = ((Math.floor(r.s) % N) + N) % N, f = r.s - Math.floor(r.s), k = (j + 1) % N;
  const px = P[j].x + (P[k].x - P[j].x) * f + Nrm[j].x * lane, pz = P[j].z + (P[k].z - P[j].z) * f + Nrm[j].z * lane;
  if (dt > 0) r.h = Math.atan2(px - r.x, pz - r.z) || r.h;
  r.x = px; r.z = pz;
}
function collideCars() {
  for (const r of rivals) {
    const dx = player.x - r.x, dz = player.z - r.z, d = Math.hypot(dx, dz);
    if (d > 0 && d < 3.2) {
      const ux = dx / d, uz = dz / d, push = 3.2 - d;
      player.x += ux * push * .7; player.z += uz * push * .7; r.s -= push * .3 / SEG;
      const vn = player.vx * ux + player.vz * uz; if (vn < 0) { player.vx -= 1.3 * vn * ux; player.vz -= 1.3 * vn * uz; }
      player.vx *= .97; player.vz *= .97; r.v *= .97;
    }
  }
}
const drawEl = document.getElementById("drift");
function flashDrift(t) { drawEl.textContent = t; drawEl.style.opacity = 1; clearTimeout(flashDrift.t); flashDrift.t = setTimeout(() => drawEl.style.opacity = 0, 600); }
const fmt = s => s ? `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}` : "–";
const ord = n => n + (["th", "st", "nd", "rd"][n] || "th");

function update(dt) {
  t += dt;
  const ctl = state === "race" || state === "done" ? input() : { gas: 0, brake: 0, steer: 0, hand: 0 };
  if (state === "done") { ctl.gas = 0; ctl.brake = 1; ctl.steer = 0; }
  if (state === "count") {
    countdown -= dt;
    big.textContent = countdown > 3 ? "" : countdown > 0 ? Math.ceil(countdown) : "GO!";
    if (countdown <= 0) { state = "race"; setTimeout(() => big.textContent = "", 700); }
  }
  if (state === "race") { raceT += dt; lapT += dt; }
  if (state !== "menu") {
    updatePlayer(dt, ctl);
    rivals.forEach(r => updateRival(r, dt));
    collideCars();
  } else { // attract mode: everyone cruises
    rivals.forEach(r => { r.v = 30 * r.skill; r.s += r.v * dt / SEG; updateRival(r, 0); });
  }
  // laps
  if (state === "race") {
    const lap = Math.floor(player.prog / N);
    if (lap > player.lap) {
      player.lap = lap; lapTimes.push(lapT);
      if (!bestLap || lapT < bestLap) { bestLap = lapT; try { localStorage.setItem("drift-lap", bestLap.toFixed(2)); } catch {} }
      lapT = 0;
      if (lap >= LAPS) finish(); else { big.textContent = lap === LAPS - 1 ? "FINAL LAP" : `LAP ${lap + 1}`; setTimeout(() => big.textContent = "", 1200); }
    }
    for (const r of rivals) if (!r.done && r.prog >= LAPS * N) { r.done = true; finishOrder.push(r); }
  }
  // meshes
  const all = [player, ...rivals];
  for (const c of all) { c.mesh.position.set(c.x, 0, c.z); c.mesh.rotation.y = c.h; }
  const spin = (player.vf || 0) * dt / .38;
  player.mesh.wheels.forEach((w, k) => { w.children[0].rotation.x += spin; if (k < 2) w.rotation.y = ctl.steer * .45; });
  player.mesh.rotation.z = -(player.vl || 0) * .012; // body roll
  rivals.forEach(r => r.mesh.wheels.forEach(w => w.children[0].rotation.x += r.v * dt / .38));
  // HUD
  const pos = 1 + rivals.filter(r => r.prog > player.prog || (r.done && state === "race")).length;
  tl.innerHTML = state === "menu" ? "" : `<b>${ord(state === "done" ? player.place : pos)}</b> / 4<br>Lap ${Math.min(LAPS, Math.max(1, player.lap + 1))} / ${LAPS}`;
  tr.innerHTML = state === "menu" ? "" : `${fmt(raceT)}<br><small>Lap ${fmt(lapT)} · Best ${fmt(bestLap)}</small>`;
  spd.innerHTML = state === "menu" ? "" : `${Math.round(Math.abs(player.vf || 0) * 3.6)}<small> km/h${player.boost > 0 ? " · BOOST" : ""}</small>`;
}
function finish() {
  state = "done";
  player.place = 1 + finishOrder.length;
  const nb = !bestRace || raceT < bestRace; if (nb) { bestRace = raceT; try { localStorage.setItem("drift-race", bestRace.toFixed(2)); } catch {} }
  big.textContent = player.place === 1 ? "WINNER!" : ord(player.place);
  setTimeout(() => {
    big.textContent = "";
    ovT.textContent = player.place === 1 ? "You win!" : `Finished ${ord(player.place)}`;
    ovP.innerHTML = `Race ${fmt(raceT)} · best lap ${fmt(Math.min(...lapTimes))}<br>Record ${fmt(bestRace)} · lap record ${fmt(bestLap)}`;
    go.textContent = "Race again"; ov.hidden = false;
  }, 2200);
}

// ---------- minimap
const mctx = map.getContext("2d");
const xs = P.map(p => p.x), zs = P.map(p => p.z), minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
const sc = 260 / Math.max(maxX - minX, maxZ - minZ), mx = x => 20 + (x - minX) * sc, mz = z => 20 + (z - minZ) * sc;
function drawMap() {
  mctx.clearRect(0, 0, 300, 300);
  mctx.strokeStyle = "#fffc"; mctx.lineWidth = 9; mctx.lineJoin = "round"; mctx.beginPath();
  P.forEach((p, i) => i ? mctx.lineTo(mx(p.x), mz(p.z)) : mctx.moveTo(mx(p.x), mz(p.z))); mctx.closePath(); mctx.stroke();
  for (const c of [...rivals, player]) { mctx.fillStyle = "#" + c.mesh.children[0].material.color.getHexString(); mctx.beginPath(); mctx.arc(mx(c.x), mz(c.z), c === player ? 11 : 8, 0, 7); mctx.fill(); }
}

// ---------- loop
const camPos = new THREE.Vector3(0, 30, -60), look = new THREE.Vector3();
let last = 0;
(function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  update(dt);
  const focus = state === "menu" ? rivals[2] : player;
  const vdir = Math.hypot(player.vx, player.vz) > 5 && state !== "menu" ? Math.atan2(player.vx, player.vz) : focus.h;
  const ch = focus.h + Math.atan2(Math.sin(vdir - focus.h), Math.cos(vdir - focus.h)) * .5; // camera swings toward slide direction
  const want = new THREE.Vector3(focus.x - Math.sin(ch) * 9.5, 4.2, focus.z - Math.cos(ch) * 9.5);
  camPos.lerp(want, Math.min(1, dt * 5));
  look.set(focus.x + Math.sin(focus.h) * 5, 1.2, focus.z + Math.cos(focus.h) * 5);
  camera.position.copy(camPos); camera.lookAt(look);
  camera.fov = 65 + Math.min(12, (player.vf || 0) / 4) * (state === "menu" ? 0 : 1); camera.updateProjectionMatrix();
  sun.position.set(focus.x + 30, 60, focus.z + 20); sun.target.position.set(focus.x, 0, focus.z);
  renderer.render(scene, camera);
  drawMap();
  requestAnimationFrame(loop);
})(0);
go.onclick = startRace;
reset();
window.__game = { player, rivals, startRace, get state() { return state; }, set state(v) { state = v; }, keys };
</script>
</body>
