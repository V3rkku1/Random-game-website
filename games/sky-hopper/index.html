<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Hopper</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #8fd3ff; color: #fff; font: 600 16px system-ui, sans-serif; user-select: none; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; font: 800 22px system-ui; text-shadow: 0 2px 6px #0006; pointer-events: none; }
  #ov { position: fixed; inset: 0; display: grid; place-items: center; background: #0a1a3366; backdrop-filter: blur(3px); }
  #ov[hidden] { display: none; }
  #ov div { background: #12233fdd; padding: 26px 32px; border-radius: 18px; text-align: center; max-width: 420px; margin: 16px; }
  #ov h1 { margin: 0 0 8px; font-size: 34px; }
  #ov p { color: #c4d4ee; line-height: 1.5; margin: 0 0 16px; font-weight: 500; }
  #ov button { font: 800 17px system-ui; border: 0; border-radius: 12px; padding: 12px 26px; cursor: pointer; background: #ffc53d; color: #3a2600; }
</style>
</head>
<body>
<!-- three.js r128 (same CDN as the site's other 3D games); no physics lib needed: lanes + boxes -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div id="hud"><span id="sc">0</span><span id="co">◎ 0</span></div>
<div id="ov"><div><h1 id="ovT">Sky Hopper</h1>
  <p id="ovP">Race the hover-bot along the sky road.<br>← → switch lanes · ↑ / Space jump · ↓ slide<br>On touch: swipe. Grab rings, dodge the rest.</p>
  <button id="go">Play</button></div></div>
<script>
const LANES = [-2.4, 0, 2.4], SEG = 12, VIEW = 160;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 50, VIEW);
const camera = new THREE.PerspectiveCamera(62, 1, .1, 400);
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 78 : 62; camera.updateProjectionMatrix(); };
resize(); addEventListener("resize", resize);

scene.add(new THREE.HemisphereLight(0xdff3ff, 0x6a7fa8, .75));
const sun = new THREE.DirectionalLight(0xfff2dd, .9);
sun.position.set(-8, 18, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -30, far: 60 });
scene.add(sun, sun.target);

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .6, flatShading: true });
const M = { road: mat(0xdfe3ef), road2: mat(0xd0d6e8), edge: mat(0x5b6bd6), stripe: mat(0x9aa6d6), low: mat(0xff6b6b), high: mat(0xffa94d), crate: mat(0x8a5cf6), ring: new THREE.MeshStandardMaterial({ color: 0xffd43b, metalness: .6, roughness: .25, emissive: 0x6b4d00 }), cloud: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }) };

// --- road segments recycled as the world scrolls toward the camera (+z)
const road = [];
for (let i = 0; i < VIEW / SEG + 2; i++) {
  const g = new THREE.Group();
  const slab = new THREE.Mesh(new THREE.BoxGeometry(7.6, .6, SEG), i % 2 ? M.road2 : M.road); slab.position.y = -.3; slab.receiveShadow = true;
  const under = new THREE.Mesh(new THREE.BoxGeometry(6.4, 1.2, SEG - .4), M.edge); under.position.y = -1.1;
  g.add(slab, under);
  for (const s of [-1, 1]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(.3, .35, SEG), M.edge); rail.position.set(s * 3.95, .05, 0); g.add(rail);
    const st = new THREE.Mesh(new THREE.BoxGeometry(.08, .02, SEG * .45), M.stripe); st.position.set(s * 1.2, .01, 0); g.add(st);
  }
  g.position.z = -i * SEG; scene.add(g); road.push(g);
}
// --- clouds for parallax
const clouds = [];
for (let i = 0; i < 26; i++) {
  const g = new THREE.Group();
  for (let k = 0; k < 4; k++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5 + Math.random() * 2, 0), M.cloud); s.position.set(k * 2.2 - 3, Math.random(), Math.random() * 2); g.add(s); }
  const side = i % 2 ? 1 : -1;
  g.position.set(side * (16 + Math.random() * 30), -12 + Math.random() * 22, -Math.random() * VIEW);
  scene.add(g); clouds.push(g);
}

// --- hover-bot (original design: capsule body, visor, fin, thruster glow)
const bot = new THREE.Group();
const body = new THREE.Mesh(new THREE.SphereGeometry(.55, 24, 16), new THREE.MeshStandardMaterial({ color: 0x2ec4b6, roughness: .3, metalness: .2 }));
body.scale.set(1, 1.15, 1); body.position.y = .9; body.castShadow = true;
const visor = new THREE.Mesh(new THREE.SphereGeometry(.42, 20, 12, -Math.PI * .45, Math.PI * .9, Math.PI * .3, Math.PI * .3), new THREE.MeshStandardMaterial({ color: 0x0b1d3a, roughness: .1, metalness: .6, emissive: 0x0a3d62 }));
visor.position.set(0, 1.0, -.18); visor.rotation.y = Math.PI;
const fin = new THREE.Mesh(new THREE.BoxGeometry(.08, .35, .45), new THREE.MeshStandardMaterial({ color: 0xffc53d })); fin.position.set(0, 1.55, .1);
const glow = new THREE.Mesh(new THREE.CylinderGeometry(.32, .12, .35, 16), new THREE.MeshBasicMaterial({ color: 0x7af7ff, transparent: true, opacity: .7 })); glow.position.y = .22;
const pack = new THREE.Group(), packM = new THREE.MeshStandardMaterial({ color: 0xff8c42, roughness: .4 });
for (const s of [-1, 1]) { const tank = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .55, 12), packM); tank.position.set(s * .2, 0, 0); tank.castShadow = true; pack.add(tank); }
const jet = new THREE.Mesh(new THREE.CircleGeometry(.1, 12), new THREE.MeshBasicMaterial({ color: 0x7af7ff })); jet.position.set(0, -.2, .14); pack.add(jet);
pack.position.set(0, 1, .55);
const eyeM = new THREE.MeshBasicMaterial({ color: 0x7af7ff });
for (const s of [-1, 1]) { const eye = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 6), eyeM); eye.position.set(s * .15, 1.05, -.6); bot.add(eye); }
bot.add(body, visor, fin, glow, pack); scene.add(bot);

// --- obstacles & rings
const things = [];
const geo = { low: new THREE.BoxGeometry(2, .7, .5), high: new THREE.BoxGeometry(2, .5, .5), post: new THREE.BoxGeometry(.2, 2.6, .2), crate: new THREE.BoxGeometry(1.9, 2.2, 1.9), ring: new THREE.TorusGeometry(.35, .09, 10, 24) };
function add(kind, lane, z, y = 0) {
  let m;
  if (kind === "high") { // bar on two posts: slide under
    m = new THREE.Group();
    const bar = new THREE.Mesh(geo.high, M.high); bar.position.y = 1.65; bar.castShadow = true;
    const p1 = new THREE.Mesh(geo.post, M.edge), p2 = p1.clone(); p1.position.set(-.95, 1.3, 0); p2.position.set(.95, 1.3, 0);
    m.add(bar, p1, p2);
  } else {
    m = new THREE.Mesh(geo[kind], M[kind]); m.castShadow = true;
    m.position.y = kind === "low" ? .35 : kind === "crate" ? 1.1 : y;
  }
  m.position.x = LANES[lane]; m.position.z = z;
  if (kind === "ring") m.position.y = y;
  scene.add(m); things.push({ kind, lane, m, y });
}
let nextRow;
function spawnRow(z) {
  const r = Math.random();
  if (r < .25) { // ring line in a free lane
    const lane = Math.random() * 3 | 0, arc = Math.random() < .4;
    for (let k = 0; k < 6; k++) add("ring", lane, z - k * 2.2, arc ? 1 + Math.sin(k / 5 * Math.PI) * 2 : 1);
    return 16;
  }
  const blocked = Math.random() < .5 ? 1 : 2, lanes = [0, 1, 2].sort(() => Math.random() - .5);
  for (let k = 0; k < 3; k++) {
    const lane = lanes[k];
    if (k < blocked) add(Math.random() < .5 ? "crate" : Math.random() < .5 ? "low" : "high", lane, z);
    else if (k === blocked) { if (Math.random() < .5) add(["low", "high"][Math.random() * 2 | 0], lane, z); }
    else if (Math.random() < .6) add("ring", lane, z, 1);
  }
  return 14 + Math.random() * 8;
}

// --- state
let state = "menu", speed, dist, coins, lane, x, y, vy, slide, best = 0, t = 0, shake = 0;
try { best = +localStorage.getItem("sky-best") || 0; } catch {}
function reset() {
  for (const o of things) scene.remove(o.m);
  things.length = 0; speed = 16; dist = 0; coins = 0; lane = 1; x = 0; y = 0; vy = 0; slide = 0; nextRow = -40;
  while (nextRow > -VIEW) nextRow -= spawnRow(nextRow);
  bot.rotation.set(0, 0, 0);
}
function start() { reset(); state = "play"; ov.hidden = true; }
function over() {
  state = "over"; shake = .4;
  const score = Math.floor(dist) + coins * 10;
  const nb = score > best; if (nb) { best = score; try { localStorage.setItem("sky-best", best); } catch {} }
  setTimeout(() => { ovT.textContent = nb ? "New best!" : "Crashed!"; ovP.innerHTML = `Score <b>${score}</b> · ${coins} rings · ${Math.floor(dist)} m<br>Best ${best}`; go.textContent = "Again"; ov.hidden = false; }, 700);
}

function move(d) { if (state === "play") lane = Math.max(0, Math.min(2, lane + d)); }
function jump() { if (state === "play" && y <= 0.001) { vy = 9.5; slide = 0; } }
function duck() { if (state !== "play") return; slide = .7; if (y > 0) vy = -16; }

function update(dt) {
  t += dt;
  if (state !== "play") {
    bot.position.y = Math.sin(t * 2) * .08 + (state === "over" ? -0.3 : 0);
    if (state === "menu") bot.rotation.y = t * .6;
    return;
  }
  speed = Math.min(42, speed + dt * .45);
  const dz = speed * dt; dist += dz;
  x += (LANES[lane] - x) * Math.min(1, dt * 14);
  vy -= 30 * dt; y = Math.max(0, y + vy * dt); if (y === 0) vy = 0;
  slide = Math.max(0, slide - dt);

  for (const g of road) { g.position.z += dz; if (g.position.z > SEG) g.position.z -= road.length * SEG; }
  for (const c of clouds) { c.position.z += dz * .35; if (c.position.z > 20) c.position.z -= VIEW + 20; }
  nextRow += dz; while (nextRow > -VIEW) nextRow -= spawnRow(nextRow);

  const top = slide ? .9 : 1.75; // bot height above its feet
  for (let i = things.length - 1; i >= 0; i--) {
    const o = things[i], m = o.m; m.position.z += dz;
    if (o.kind === "ring") m.rotation.y += dt * 4;
    if (m.position.z > 6) { scene.remove(m); things.splice(i, 1); continue; }
    if (Math.abs(m.position.z) > (o.kind === "crate" ? 1.3 : .6) || Math.abs(LANES[o.lane] - x) > 1.1) continue;
    if (o.kind === "ring") { if (Math.abs(o.y - (y + top / 2)) < 1.2) { coins++; scene.remove(m); things.splice(i, 1); } continue; }
    if (o.kind === "low" && y > .7) continue;
    if (o.kind === "high" && y + top < 1.4) continue;
    return over();
  }
  bot.position.set(x, y + Math.sin(t * 10) * .04, 0);
  bot.rotation.z = (x - LANES[lane]) * .25;
  bot.rotation.x = slide ? -.9 : vy * .02;
  bot.scale.y = slide ? .55 : 1;
  glow.scale.y = 1 + Math.sin(t * 40) * .2;
  sc.textContent = Math.floor(dist) + coins * 10; co.textContent = "◎ " + coins;
}

let last = 0;
(function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  update(dt);
  shake = Math.max(0, shake - dt);
  camera.position.set(bot.position.x * .6 + (Math.random() - .5) * shake, 3.6 + y * .4, 7.5);
  camera.lookAt(bot.position.x * .4, 1.2 + y * .3, -8);
  sun.position.set(bot.position.x - 8, 18, 6); sun.target.position.set(bot.position.x, 0, -6);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})(0);

addEventListener("keydown", e => {
  const k = e.code;
  if (["ArrowLeft", "KeyA"].includes(k)) move(-1);
  else if (["ArrowRight", "KeyD"].includes(k)) move(1);
  else if (["ArrowUp", "KeyW", "Space"].includes(k)) { e.preventDefault(); if (state !== "play" && k === "Space" && !ov.hidden) start(); else jump(); }
  else if (["ArrowDown", "KeyS"].includes(k)) { e.preventDefault(); duck(); }
});
let sx, sy;
addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
addEventListener("pointerup", e => {
  if (sx == null || state !== "play") return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return jump(); // tap = jump
  Math.abs(dx) > Math.abs(dy) ? move(Math.sign(dx)) : dy < 0 ? jump() : duck();
});
go.onclick = e => { e.stopPropagation(); start(); };
reset();
</script>
</body>
</html>
