<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Flip</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle, #2a0845, #0b0418); color: #fff; font: 600 18px system-ui; }
  #hud { text-align: center; margin-bottom: 14px; }
  #board { display: grid; grid-template-columns: repeat(4, min(20vw, 90px)); gap: 12px; perspective: 600px; }
  .c { aspect-ratio: 1; position: relative; transform-style: preserve-3d; transition: transform .4s; cursor: pointer; border: 0; padding: 0; background: none; }
  .c.up { transform: rotateY(180deg); }
  .c div { position: absolute; inset: 0; border-radius: 12px; display: grid; place-items: center; backface-visibility: hidden; font-size: min(10vw, 44px); }
  .c .f { background: linear-gradient(135deg, #7f00ff, #e100ff); box-shadow: 0 0 16px #e100ff66; }
  .c .b { background: #1c1030; transform: rotateY(180deg); border: 2px solid #e100ff; }
  .c.done .b { border-color: #00f5a0; box-shadow: 0 0 18px #00f5a0; }
  button.r { margin-top: 18px; padding: 10px 22px; border-radius: 99px; border: 0; background: #e100ff; color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div>
  <div id="hud">Moves: <span id="m">0</span> · Pairs: <span id="p">0</span>/8</div>
  <div id="board"></div>
  <div style="text-align:center"><button class="r" onclick="deal()">New Game</button></div>
</div>
<script>
const icons = ["🚀", "👾", "🍕", "🐙", "⚡", "🎸", "🌈", "💎"];
let open, moves, pairs, lock;
function deal() {
  open = []; moves = pairs = 0; lock = false; m.textContent = 0; p.textContent = 0;
  const deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
  board.innerHTML = deck.map(i => `<button class="c" data-i="${i}" aria-label="card"><div class="f"></div><div class="b">${i}</div></button>`).join("");
}
board.onclick = e => {
  const c = e.target.closest(".c");
  if (!c || lock || c.classList.contains("up")) return;
  c.classList.add("up"); open.push(c);
  if (open.length < 2) return;
  m.textContent = ++moves;
  const [a, b] = open; open = [];
  if (a.dataset.i === b.dataset.i) {
    a.classList.add("done"); b.classList.add("done");
    if (++pairs === 8) setTimeout(() => alert(`You won in ${moves} moves!`), 400);
    p.textContent = pairs;
  } else { lock = true; setTimeout(() => { a.classList.remove("up"); b.classList.remove("up"); lock = false; }, 800); }
};
deal();
</script>
</body>
</html>
