<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Grid</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0a1a; color: #fff; font: 600 18px system-ui; text-align: center; }
  #grid { display: grid; grid-template-columns: repeat(5, min(16vw, 70px)); gap: 8px; margin: 16px auto; }
  #grid button { aspect-ratio: 1; border: 0; border-radius: 12px; background: #1f1a3a; cursor: pointer; transition: background .15s, box-shadow .15s; }
  #grid button.on { background: #ffd54f; box-shadow: 0 0 18px #ffd54f; }
  .b { padding: 10px 22px; border-radius: 99px; border: 0; font: inherit; background: #ffd54f; cursor: pointer; }
</style>
</head>
<body>
<!-- skipped: solver/hint; puzzles come from random clicks on a dark board, so all are solvable -->
<div>
  <div id="hud">Level 1 · Moves 0</div>
  <div id="grid"></div>
  <button class="b" onclick="newLevel()">Restart level</button>
  <p>Each click toggles a light and its 4 neighbours. Turn every light off.</p>
</div>
<script src="../kit.js"></script>
<script>
const N = 5;
let on, start, level = 1, moves;
const toggle = (b, i) => { const r = i / N | 0, c = i % N; for (const [dr, dc] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N) b[rr * N + cc] ^= 1; } };
function render() { grid.innerHTML = on.map((v, i) => `<button class="${v ? "on" : ""}" data-i="${i}" aria-label="light ${i + 1} ${v ? "on" : "off"}"></button>`).join(""); hud.textContent = `Level ${level} · Moves ${moves}`; }
function newLevel(next) {
  if (next || !start) { start = Array(N * N).fill(0); do { for (let k = 0; k < 2 + level * 2; k++) toggle(start, Math.random() * N * N | 0); } while (!start.some(Boolean)); }
  on = [...start]; moves = 0; render();
}
grid.onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  toggle(on, +b.dataset.i); moves++; render();
  if (!on.some(Boolean)) { hud.textContent = `Level ${level} cleared in ${moves} moves!`; kit.sfx("win"); kit.xp(10 + level * 5, `level ${level}`); level++; setTimeout(() => newLevel(true), 1000); }
};
newLevel(true);
</script>
</body>
</html>
