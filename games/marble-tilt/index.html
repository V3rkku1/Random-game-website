<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble Tilt</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #1a1430; color: #fff; font: 600 16px system-ui, sans-serif; user-select: none; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; font: 800 20px system-ui; text-shadow: 0 2px 6px #0008; pointer-events: none; }
  #banner { position: fixed; inset: 0; display: grid; place-items: center; font: 900 min(10vw, 52px) system-ui; text-shadow: 0 4px 16px #000a; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #ov { position: fixed; inset: 0; display: grid; place-items: center; background: #0007; backdrop-filter: blur(3px); }
  #ov[hidden] { display: none; }
  #ov div { background: #2a2148ee; padding: 26px 32px; border-radius: 18px; text-align: center; max-width: 420px; margin: 16px; }
  #ov h1 { margin: 0 0 8px; font-size: 34px; }
  #ov p { color: #cfc6ee; line-height: 1.5; margin: 0 0 16px; font-weight: 500; }
  #ov button { font: 800 17px system-ui; border: 0; border-radius: 12px; padding: 12px 26px; cursor: pointer; background: #5ef0a0; color: #0c3020; }
</style>
</head>
<body>
<!-- three.js r128 only; marble physics is hand-rolled 2D on the tile grid (circle vs box), no physics lib -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit.js"></script>
<div id="hud"><span id="lv"></span><span id="tm">0.0s</span></div>
<div id="banner"></div>
<div id="ov"><div><h1 id="ovT">Marble Tilt</h1>
  <p id="ovP">Tilt the board to roll the marble into the green goal.<br>Arrow keys / WASD, or drag anywhere.<br>Holes and edges drop you back to the start.</p>
  <button id="go">Play</button></div></div>
<script>
// Legend: # wall · . floor · o hole · S start · G goal · space = open air
const LEVELS = [
  ["#############",
   "#S..........#",
   "#...........#",
   "#..#######..#",
   "#...........#",
   "#..........G#",
   "#############"],
  ["#############",
   "#S..o.......#",
   "#...o...o...#",
   "#.o.....o...#",
   "#.o..ooo..o.#",
   "#.....o.....#",
   "#..o.....o.G#",
   "#############"],
  ["................",
   ".S..............",
   "              ..",
   "              ..",
   "................",
   "................",
   "..",
   "..",
   "..............G.",
   "................"],
  ["###############",
   "#S............#",
   "#.###########.#",
   "#.#.o.....o.#.#",
   "#.#.#######.#.#",
   "#.#.#G....#.#.#",
   "#.#.#####.#.#.#",
   "#.#.........#.#",
   "#.#.#########.#",
   "#....o........#",
   "###############"],
  ["....",
   ".S..",
   "....",
   "  .",
   "  .",
   "  ......",
   "       .",
   "       .",
   "    ....",
   "    .",
   "    .",
   "   ...",
   "   .G.",
   "   ..."],
  ["#################",
   "#S..#.....o.....#",
   "#...#.###...###.#",
   "#.o...#.o.#...#.#",
   "###.###.###.#.#.#",
   "#...o.....#.#o#.#",
   "#.#######.#.#...#",
   "#.....o.....#.#G#",
   "#################"],
];
const R = .32, G = 26, MAXTILT = .2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1430);
scene.fog = new THREE.Fog(0x1a1430, 18, 40);
const camera = new THREE.PerspectiveCamera(50, 1, .1, 100);
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
resize(); addEventListener("resize", resize);
scene.add(new THREE.HemisphereLight(0xcfc4ff, 0x2a1f40, .7));
const sun = new THREE.DirectionalLight(0xffffff, .9);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
scene.add(sun, sun.target);

// checker texture so floor reads as tiles
const tex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
  x.fillStyle = "#d9b98c"; x.fillRect(0, 0, 64, 64); x.strokeStyle = "#b8956a"; x.lineWidth = 3; x.strokeRect(1.5, 1.5, 61, 61);
  for (let i = 0; i < 30; i++) { x.fillStyle = `rgba(120,80,40,${Math.random() * .08})`; x.fillRect(0, Math.random() * 64, 64, 1 + Math.random() * 2); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
})();
const marbleTex = (() => {
  const c = document.createElement("canvas"); c.width = 128; c.height = 64; const x = c.getContext("2d");
  x.fillStyle = "#3d8bff"; x.fillRect(0, 0, 128, 64);
  x.fillStyle = "#ffffff"; x.fillRect(0, 28, 128, 8); x.fillRect(60, 0, 8, 64);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
})();
const M = {
  floor: new THREE.MeshStandardMaterial({ map: tex, roughness: .8 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x7b4f9e, roughness: .55 }),
  pit: new THREE.MeshBasicMaterial({ color: 0x050308 }),
  goal: new THREE.MeshStandardMaterial({ color: 0x5ef0a0, emissive: 0x1f8050, roughness: .4 }),
};
const board = new THREE.Group(); scene.add(board);
const marble = new THREE.Mesh(new THREE.SphereGeometry(R, 32, 20), new THREE.MeshStandardMaterial({ map: marbleTex, roughness: .15, metalness: .15 }));
marble.castShadow = true;
const beam = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, 4, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0x5ef0a0, transparent: true, opacity: .18, side: THREE.DoubleSide, depthWrite: false }));

let grid, W, H, start, goal, level = 0, pos, vel, tilt = { x: 0, z: 0 }, falling = 0, state = "menu", time = 0, falls = 0, t = 0;
let bestTotal = 0; try { bestTotal = +localStorage.getItem("marble-best") || 0; } catch {}
const tile = (c, r) => grid[r]?.[c] ?? " ";
const center = (c, r) => [c + .5 - W / 2, r + .5 - H / 2];

function build(n) {
  board.clear(); board.rotation.set(0, 0, 0); tilt = { x: 0, z: 0 };
  const rows = LEVELS[n]; H = rows.length; W = Math.max(...rows.map(r => r.length));
  grid = rows.map(r => r.padEnd(W, " "));
  const floor = [], walls = [];
  grid.forEach((row, r) => [...row].forEach((ch, c) => {
    const [x, z] = center(c, r);
    if (ch === "S") start = [x, z];
    if (ch === "G") goal = [x, z];
    if (ch === "#") walls.push([x, z]);
    if (ch === "o") { // square frame around a deep pit
      for (const [dx, dz, w, d] of [[0, -.45, 1, .1], [0, .45, 1, .1], [-.45, 0, .1, .8], [.45, 0, .1, .8]]) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, .3, d), M.floor); m.position.set(x + dx, -.15, z + dz); m.receiveShadow = true; board.add(m);
      }
      const pit = new THREE.Mesh(new THREE.BoxGeometry(.8, 1.5, .8), M.pit); pit.position.set(x, -1.05, z); board.add(pit);
    } else if (ch !== " ") floor.push([x, z]);
  }));
  const inst = (geo, mat, list, y) => {
    const m = new THREE.InstancedMesh(geo, mat, list.length), o = new THREE.Object3D();
    list.forEach(([x, z], i) => { o.position.set(x, y, z); o.updateMatrix(); m.setMatrixAt(i, o.matrix); });
    m.castShadow = m.receiveShadow = true; board.add(m);
  };
  inst(new THREE.BoxGeometry(1, .3, 1), M.floor, floor, -.15);
  inst(new THREE.BoxGeometry(1, .6, 1), M.wall, walls, .15);
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .04, 32), M.goal); pad.position.set(goal[0], .02, goal[1]);
  beam.position.set(goal[0], 2, goal[1]);
  board.add(pad, beam, marble);
  respawn();
  lv.textContent = `Level ${n + 1} / ${LEVELS.length}`;
}
function respawn() { pos = [...start]; vel = [0, 0]; falling = 0; marble.position.set(pos[0], R, pos[1]); }
function flash(text, ms = 900) { banner.textContent = text; banner.style.opacity = 1; clearTimeout(flash.t); flash.t = setTimeout(() => banner.style.opacity = 0, ms); }

function collide() { // marble vs wall tiles in the 3x3 neighbourhood
  const c0 = Math.floor(pos[0] + W / 2), r0 = Math.floor(pos[1] + H / 2);
  for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = c0 - 1; c <= c0 + 1; c++) {
    if (tile(c, r) !== "#") continue;
    const [x, z] = center(c, r);
    const nx = Math.max(x - .5, Math.min(x + .5, pos[0])), nz = Math.max(z - .5, Math.min(z + .5, pos[1]));
    const dx = pos[0] - nx, dz = pos[1] - nz, d = Math.hypot(dx, dz);
    if (d >= R || d === 0) continue;
    const ux = dx / d, uz = dz / d, vn = vel[0] * ux + vel[1] * uz;
    pos[0] += ux * (R - d); pos[1] += uz * (R - d);
    if (vn < -2.5) kit.sfx("bounce", .5);
    if (vn < 0) { vel[0] -= 1.45 * vn * ux; vel[1] -= 1.45 * vn * uz; } // restitution .45
  }
}
function overHole() {
  const c = Math.floor(pos[0] + W / 2), r = Math.floor(pos[1] + H / 2), ch = tile(c, r);
  if (ch === " ") return true;
  if (ch !== "o") return false;
  const [x, z] = center(c, r);
  return Math.abs(pos[0] - x) < .4 - R * .4 && Math.abs(pos[1] - z) < .4 - R * .4;
}

const keys = {}, drag = { on: false, x: 0, y: 0, dx: 0, dy: 0 };
function update(dt) {
  t += dt;
  beam.material.opacity = .14 + Math.sin(t * 3) * .06;
  if (state !== "play") { board.rotation.x = Math.sin(t * .7) * .05; board.rotation.z = Math.cos(t * .5) * .05; return; }
  time += dt; tm.textContent = time.toFixed(1) + "s";
  let tx = ((keys.ArrowDown || keys.KeyS || 0) - (keys.ArrowUp || keys.KeyW || 0)) * MAXTILT;
  let tz = ((keys.ArrowLeft || keys.KeyA || 0) - (keys.ArrowRight || keys.KeyD || 0)) * MAXTILT;
  if (drag.on) { tx = Math.max(-1, Math.min(1, drag.dy / 120)) * MAXTILT; tz = -Math.max(-1, Math.min(1, drag.dx / 120)) * MAXTILT; }
  tilt.x += (tx - tilt.x) * Math.min(1, dt * 8); tilt.z += (tz - tilt.z) * Math.min(1, dt * 8);
  board.rotation.x = tilt.x; board.rotation.z = tilt.z;

  if (falling) {
    falling += dt; vel[0] *= .98; vel[1] *= .98;
    pos[0] += vel[0] * dt; pos[1] += vel[1] * dt;
    marble.position.set(pos[0], R - 9 * falling * falling, pos[1]);
    if (falling > .8) { falls++; respawn(); }
    return;
  }
  const steps = 4, h = dt / steps; // substeps keep fast marbles from tunnelling into walls
  for (let i = 0; i < steps; i++) {
    vel[0] += -G * Math.sin(tilt.z) * h; vel[1] += G * Math.sin(tilt.x) * h;
    const damp = Math.exp(-.5 * h); vel[0] *= damp; vel[1] *= damp;
    pos[0] += vel[0] * h; pos[1] += vel[1] * h;
    collide();
  }
  const sp = Math.hypot(vel[0], vel[1]);
  if (sp > 1e-4) marble.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(vel[1] / sp, 0, -vel[0] / sp), sp * dt / R));
  marble.position.set(pos[0], R, pos[1]);
  if (overHole()) { falling = 1e-3; flash("Oops!", 600); kit.sfx("lose"); return; }
  if (Math.hypot(pos[0] - goal[0], pos[1] - goal[1]) < .42) {
    if (level + 1 < LEVELS.length) { flash(`Level ${level + 1} clear!`); kit.sfx("win"); kit.xp(25 + level * 5, `level ${level + 1}`); state = "pause"; setTimeout(() => { build(++level); state = "play"; }, 1100); }
    else finish();
  }
}
function finish() {
  state = "over"; kit.sfx("win"); kit.xp(120, "all levels");
  const nb = !bestTotal || time < bestTotal;
  if (nb) { bestTotal = +time.toFixed(1); try { localStorage.setItem("marble-best", bestTotal); } catch {} }
  ovT.textContent = nb ? "New record!" : "All levels done!";
  ovP.innerHTML = `Total time <b>${time.toFixed(1)}s</b> · ${falls} falls<br>Best ${bestTotal}s`;
  go.textContent = "Play again"; ov.hidden = false;
}
function startGame() { level = 0; time = 0; falls = 0; build(0); state = "play"; ov.hidden = true; }

const wp = new THREE.Vector3();
let last = 0;
(function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (!kit.paused) update(dt);
  marble.getWorldPosition(wp);
  const look = state === "menu" ? new THREE.Vector3(0, 0, 0) : wp.setY(0);
  camera.position.lerp(new THREE.Vector3(look.x, 12.5, look.z + 8), state === "menu" ? 1 : Math.min(1, dt * 4));
  camera.lookAt(camera.position.x, 0, camera.position.z - 8);
  sun.position.set(camera.position.x + 5, 14, camera.position.z - 2); sun.target.position.set(camera.position.x, 0, camera.position.z - 8);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})(0);

addEventListener("keydown", e => { keys[e.code] = 1; if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault(); if (e.code === "KeyR" && state === "play") respawn(); });
addEventListener("keyup", e => keys[e.code] = 0);
addEventListener("pointerdown", e => { if (e.target === renderer.domElement) Object.assign(drag, { on: true, x: e.clientX, y: e.clientY, dx: 0, dy: 0 }); });
addEventListener("pointermove", e => { if (drag.on) { drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y; } });
addEventListener("pointerup", () => drag.on = false);
kit.pausable(() => state === "play");
go.onclick = startGame;
build(0);
</script>
</body>
</html>
