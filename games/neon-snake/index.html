<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #050510; color: #fff; font: 600 18px system-ui; touch-action: none; }
  canvas { background: #0a0a1f; border-radius: 12px; box-shadow: 0 0 40px #00f5a055; max-width: 95vw; max-height: 80vh; }
  #hud { text-align: center; margin-bottom: 10px; }
  #msg { position: absolute; text-align: center; text-shadow: 0 0 12px #00f5a0; pointer-events: none; }
</style>
</head>
<body>
<div><div id="hud">Score: <span id="s">0</span> · Best: <span id="b">0</span></div><canvas id="c" width="400" height="400"></canvas></div>
<div id="msg">Arrows / WASD / swipe<br>Press any key to start</div>
<script>
const N = 20, S = 20, ctx = c.getContext("2d");
let best = 0; try { best = +localStorage.snakeBest || 0; } catch {}
b.textContent = best;
let snake, dir, next, food, score, alive = false, loop;
const place = () => { do food = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; while (snake.some(p => p.x === food.x && p.y === food.y)); };
function start() {
  snake = [{ x: 10, y: 10 }]; dir = next = { x: 1, y: 0 }; score = 0; s.textContent = 0; alive = true; msg.style.display = "none";
  place(); clearInterval(loop); loop = setInterval(step, 100);
}
function step() {
  dir = next;
  const h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
  if (snake.some(p => p.x === h.x && p.y === h.y)) return over();
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { s.textContent = ++score; place(); } else snake.pop();
  draw();
}
function over() {
  alive = false; clearInterval(loop);
  if (score > best) { best = score; b.textContent = best; try { localStorage.snakeBest = best; } catch {} }
  msg.innerHTML = `Game Over · ${score}<br>Press any key`; msg.style.display = "";
}
function draw() {
  ctx.fillStyle = "#0a0a1f"; ctx.fillRect(0, 0, 400, 400);
  ctx.shadowBlur = 15;
  ctx.shadowColor = ctx.fillStyle = "#ff2e88";
  ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2.5, 0, 7); ctx.fill();
  snake.forEach((p, i) => {
    ctx.shadowColor = ctx.fillStyle = `hsl(${160 + i * 3}, 100%, ${60 - i * 0.5}%)`;
    ctx.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2);
  });
  ctx.shadowBlur = 0;
}
const turn = (x, y) => { if (x !== -dir.x || y !== -dir.y) next = { x, y }; };
const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
addEventListener("keydown", e => {
  if (!alive) return start();
  const k = keys[e.key]; if (k) { e.preventDefault(); turn(...k); }
});
let tx, ty;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; if (!alive) start(); });
addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});
</script>
</body>
</html>
