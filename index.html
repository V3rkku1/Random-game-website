<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Games</title>
  <meta name="description" content="Free browser games for short breaks: arcade, puzzle, board and 3D games. Nothing to install.">
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body>
  <nav>
    <a class="logo" href="./">random games</a>
    <div class="links"><a href="#games">Games</a><a href="#" id="nav-random">Surprise me</a></div>
  </nav>

  <header class="hero">
    <h1>Small games for short breaks.</h1>
    <p>Free, in your browser, nothing to install.</p>
    <button class="btn" id="random">Play something random</button>
    <div class="lvl" id="lvl" hidden></div>
  </header>

  <main id="games">
    <section id="recent" hidden>
      <h2>Continue playing</h2>
      <div class="grid small" id="recent-grid"></div>
    </section>
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <span class="count" id="count"></span>
      <select class="search sort" id="sort" aria-label="Sort games"><option value="">Featured</option><option value="new">Newest</option><option value="az">A–Z</option></select>
      <input class="search" id="search" type="search" placeholder="Search  ( / )" aria-label="Search games">
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <footer>random games</footer>

  <!-- GitHub Pages caches 10 min; timestamp forces fresh game list -->
  <script>document.write(`<script src="games.js?${Date.now()}"><\/script>`+`<script src="app.js?${Date.now()}"><\/script>`)</script>
</body>
</html>
